{% extends 'base.html' %}

{% block content %}


<style>


body{

    margin:0;

    background:
    linear-gradient(
    135deg,
    #020617,
    #1e3a8a
    );

    min-height:100vh;

}

.login-container{

    display:flex;

    justify-content:center;

    align-items:flex-start;

    min-height:calc(100vh - 76px);

    padding:100px 20px 40px;

}

/* Card */

.login-card{

    width:430px;

    padding:40px;


    background:rgba(255,255,255,0.15);


    backdrop-filter:blur(25px);


    -webkit-backdrop-filter:blur(25px);


    border-radius:25px;


    border:1px solid rgba(255,255,255,0.25);


    box-shadow:

    0 20px 50px rgba(0,0,0,0.45);


    color:white;


}



/* Heading */


.login-card h2{


text-align:center;

font-size:32px;

margin-bottom:10px;


}



.subtitle{


text-align:center;

color:#cbd5e1;

margin-bottom:30px;


}



/* Messages */


.alert{


padding:12px;

border-radius:12px;

margin-bottom:20px;

font-size:14px;


}


.alert-error{

background:#7f1d1d;

color:#fecaca;

}


.alert-success{

background:#064e3b;

color:#a7f3d0;

}




/* Inputs */


.form-control{


width:100%;


padding:14px 45px 14px 14px;


border:none;


border-radius:12px;


background:

rgba(255,255,255,.15);


color:white;


margin-bottom:18px;


outline:none;


}


.form-control::placeholder{

color:#cbd5e1;

}




/* Password */


.password-box{


position:relative;


}



.eye-btn{


position:absolute;


right:15px;


top:13px;


background:none;


border:none;


color:white;


font-size:18px;


cursor:pointer;


}





/* Remember */


.remember{


display:flex;


justify-content:space-between;


align-items:center;


font-size:14px;


margin-bottom:25px;


}



.remember a{


color:#38bdf8;

text-decoration:none;


}




/* Button */


.login-btn{


width:100%;


padding:14px;


border:none;


border-radius:30px;


background:

linear-gradient(
90deg,
#38bdf8,
#2563eb
);


color:white;


font-size:17px;


font-weight:600;


cursor:pointer;


}



.login-btn:hover{


transform:translateY(-2px);


}



/* Footer */


.register-link{


text-align:center;


margin-top:25px;


}



.register-link a{


color:#38bdf8;


text-decoration:none;


}




.security{


text-align:center;


margin-top:25px;


color:#94a3b8;


font-size:13px;


}



</style>




<div class="login-container">


<div class="login-card">



<h2>

Welcome Back 👋

</h2>


<p class="subtitle">

Login to your VeriTrust AI Account

</p>




<!-- Messages -->

{% if messages %}


{% for message in messages %}


<div class="alert 

{% if message.tags == 'error' %}

alert-error

{% else %}

alert-success

{% endif %}

">


{{message}}


</div>


{% endfor %}


{% endif %}






<form method="POST" autocomplete="off">


{% csrf_token %}



<input

type="email"

name="email"

class="form-control"

placeholder="Email Address"

required

oninvalid="this.setCustomValidity('Please enter your email')"

oninput="this.setCustomValidity('')"

/>





<div class="password-box">


<input


type="password"


id="password"


name="password"


class="form-control"


placeholder="Password"


required


oninvalid="this.setCustomValidity('Please enter your password')"


oninput="this.setCustomValidity('')"



/>



<button

type="button"

class="eye-btn"

onclick="togglePassword()"

>

👁

</button>


</div>





<div class="remember">


<label>


<input type="checkbox">


Remember Me


</label>




<a href="{% url 'forgot_password' %}">

Forgot Password?

</a>



</div>






<button class="login-btn">

Login Securely

</button>



</form>






<div class="security">

🔒 Secure AI Verification System

</div>




<div class="register-link">


Don't have an account?


<a href="{% url 'register' %}">

Register

</a>


</div>



</div>


</div>






<script>


function togglePassword(){


let password = document.getElementById("password");


if(password.type === "password"){


password.type="text";


}

else{


password.type="password";


}


}


</script>



{% endblock %}
