{% extends 'base.html' %}

{% block content %}

<style>

body{
    background: linear-gradient(135deg,#0f172a,#1e3a8a);
    min-height:100vh;
}

/* Register Container */

.register-container{

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:90vh;

    padding-top:80px;

    padding-bottom:40px;

}


/* Glass Card */

.register-card{

    width:450px;

    padding:40px;

    margin-top:30px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(15px);

    border-radius:20px;

    box-shadow:0 20px 40px rgba(0,0,0,0.3);

    color:white;

}


/* Heading */

.register-card h2{

    text-align:center;
    font-size:32px;
    margin-bottom:10px;

}


.register-card p{

    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;

}


/* Inputs */

.form-control{

    width:100%;
    padding:14px;

    margin-bottom:18px;

    border-radius:10px;

    border:none;

    outline:none;

    background:rgba(255,255,255,0.15);

    color:white;

}


.form-control::placeholder{

    color:#cbd5e1;

}


/* Select */

select.form-control{

    color:white;

}


/* Button */

.register-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:30px;

    background:linear-gradient(90deg,#38bdf8,#2563eb);

    color:white;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

}


.register-btn:hover{

    transform:scale(1.03);

}


/* Login Link */

.login-link{

    text-align:center;

    margin-top:20px;

}


.login-link a{

    color:#38bdf8;

    text-decoration:none;

}


/* Responsive */

@media(max-width:500px){

.register-card{

width:90%;

}

}


</style>



<div class="register-container">


<div class="register-card">


<h2>Create Account</h2>

<p>Join VeriTrust AI secure verification platform</p>





<form method="POST" autocomplete="off">

    {% csrf_token %}

    <input type="text"
           name="username"
           class="form-control"
           placeholder="Full Name"
           autocomplete="off"
           required>

    <input type="email"
           name="email"
           class="form-control"
           placeholder="Email Address"
           autocomplete="off"
           required>

    <input type="text"
           name="mobile"
           class="form-control"
           placeholder="Mobile Number"
           autocomplete="off"
           required>

    <div class="password-box">

        <input type="password"
               id="password"
               name="password"
               class="form-control"
               placeholder="Password"
               autocomplete="new-password"
               required>

        <i class="bi bi-eye-fill toggle-password"
           onclick="togglePassword()"></i>

    </div>

    <input type="password"
           name="confirm_password"
           class="form-control"
           placeholder="Confirm Password"
           autocomplete="new-password"
           required>

    <select name="role" class="form-control" required>

        <option value="" selected disabled>Select Role</option>

        <option value="EMPLOYEE">Employee</option>

        <option value="HR">HR</option>

    </select>

    <button type="submit" class="register-btn">
        Create Account
    </button>

</form>




<div class="login-link">
    Already have an account?
    <a href="{% url 'login' %}">
    Login
</a>
</div>


</div>


</div>



<script>

function togglePassword(){

let pass=document.getElementById("password");


if(pass.type==="password"){

pass.type="text";

}

else{

pass.type="password";

}


}

</script>


{% endblock %}
